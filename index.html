<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğduk Canım Kuzenim!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px rgba(255, 255, 255, 0.1) solid;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 20px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 80px;
            color: #ffffff;
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.6);
            background-color: #ff4a6e;
        }
        .image-box {
            width: 100%;
            height: 280px;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hidden {
            display: none;
        }
        /* Konfeti Efekti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: fall 3s linear infinite;
            top: -10px;
            border-radius: 50%;
            z-index: 1;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="start-screen" class="container">
        <h1>Bizim Günümüz Geldi! 🎂🎈</h1>
        <p>Aynı gün doğmanın şansını ve güzelliğini kutlama zamanı. Sesini aç ve aşağıdaki butona basıp arkana yaslan...</p>
        <button class="btn" onclick="startSurprise()">Sürprizi Aç ✨</button>
    </div>

    <!-- ANA HİKAYE EKRANI -->
    <div id="story-screen" class="container hidden">
        <div id="img-container" class="image-box">
            <img id="story-image" src="" alt="Anılar">
        </div>
        <p id="story-text"></p>
        <button id="next-btn" class="btn" onclick="nextStep()">Devam Et ➔</button>
    </div>

    <!-- ARKA PLAN MÜZİĞİ -->
    <audio id="bg-music" loop>
        <source src="sarki.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Dosya uzantılarını senin yüklediğin gibi .jpeg olarak güncelledim
        const storySteps = [
            {
                text: "Dünyaya aynı gün gözlerimizi açmışız... Hayatın bana verdiği en güzel, en tatlı tesadüf kesinlikle sensin canım kuzenim! 🥳💖",
                image: "fotograf1.jpeg"
            },
            {
                text: "Herkes doğum gününde tek bir dilek dilerken, ben her yaşımda iyi ki benimle aynı gün doğmuşsun diye şükrediyorum. Birlikte büyümek harika!",
                image: "fotograf2.jpeg"
            },
            {
                text: "Sadece kuzen değil, aynı gün doğmuş iki suç ortağıyız biz! Seninle saçmalamayı, gülmeyi ve her anı paylaşmayı hiçbir şeye değişmem. 🌟",
                image: "fotograf3.jpeg"
            },
            {
                text: "Geleceğimiz de tıpkı senin kalbin gibi temiz ve neşeli geçsin. Yeni yaşımız ikimize de aradığımız tüm mutlulukları getirsin.",
                image: "fotograf4.jpeg"
            },
            {
                text: "İyi ki doğduk, iyi ki varız! Dünyanın en şanslı kuzeninden, dünyanın en harika kuzenine: Doğum günümüz kutlu olsun! Seni çok seviyorum! 🎉🎂❤️",
                image: "fotograf5.jpeg"
            }
        ];

        let currentStep = 0;
        const bgMusic = document.getElementById('bg-music');
        const storyTextElement = document.getElementById('story-text');
        const storyImageElement = document.getElementById('story-image');
        const imgContainer = document.getElementById('img-container');

        function startSurprise() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('story-screen').classList.remove('hidden');
            
            bgMusic.volume = 0.4; 
            bgMusic.play().catch(e => console.log("Müzik otomatik başlatılamadı."));
            
            showStep();
            createConfetti();
        }

        function showStep() {
            if (currentStep < storySteps.length) {
                const currentData = storySteps[currentStep];
                
                if(currentData.image) {
                    storyImageElement.src = currentData.image;
                    imgContainer.style.display = "block";
                } else {
                    imgContainer.style.display = "none";
                }

                typeWriter(currentData.text);

                if (currentStep === storySteps.length - 1) {
                    document.getElementById('next-btn').innerHTML = "İyi ki Benim Kuzenimsin! 🥰";
                    setInterval(createConfetti, 120); 
                }
            }
        }

        function nextStep() {
            if (currentStep < storySteps.length - 1) {
                currentStep++;
                showStep();
            }
        }

        let timer;
        function typeWriter(text) {
            clearInterval(timer);
            storyTextElement.innerHTML = "";
            let i = 0;
            timer = setInterval(() => {
                if (i < text.length) {
                    storyTextElement.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 45); 
        }

        function createConfetti() {
            const colors = ['#e94560', '#f2d74e', '#4ef2d2', '#ffffff'];
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = Math.random() * 8 + 5 + 'px';
            confetti.style.height = confetti.style.width;
            
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 3500);
        }
    </script>
</body>
</html>
